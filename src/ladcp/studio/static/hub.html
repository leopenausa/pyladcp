<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pyladcp · cruise hub</title>
<link rel="stylesheet" href="./studio.css">
<style>
/* hub pages scroll (the editor page deliberately doesn't) */
body{overflow:auto}
.hub{max-width:980px;margin:0 auto;padding:22px 20px 60px}
.hub header.hubtop{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
  border-bottom:1px solid var(--hairline);padding-bottom:12px}
.hub .crumbs{color:var(--ink-dim);font-size:12px}
.hub .crumbs b{color:var(--ink)}
.steps{display:flex;gap:8px;margin:10px 0 22px;font-size:12px;color:var(--ink-faint)}
.steps span{padding:4px 10px;border:1px solid var(--hairline);border-radius:999px}
.steps span.on{color:var(--u-col);border-color:rgba(57,211,200,.5)}
.card{background:var(--panel);border:1px solid var(--hairline);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--axis);
  margin-bottom:8px}
.card .ev{color:var(--ink-dim);font-size:12px;margin-bottom:8px}
.card label{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}
.card input[type=text]{font-family:var(--mono);font-size:13px;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--hairline);border-radius:6px;
  padding:6px 10px;width:280px}
table.st{border-collapse:collapse;font-size:12px;margin-top:6px}
table.st td,table.st th{padding:3px 12px 3px 0;text-align:left;color:var(--ink-dim)}
table.st th{color:var(--ink-faint);text-transform:uppercase;font-size:10px;letter-spacing:.08em}
table.st td:first-child{color:var(--ink)}
pre.toml,pre.score{background:var(--panel-2);border:1px solid var(--hairline);
  border-radius:8px;padding:12px;font-size:12px;overflow-x:auto;white-space:pre}
.badge{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;
  border-radius:999px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.badge.ok{color:var(--live);border:1px solid var(--live)}
.badge.warn{color:var(--warn);border:1px solid var(--warn)}
.badge.fail,.badge.error{color:#ff6b6b;border:1px solid #ff6b6b}
.badge.none{color:var(--ink-faint);border:1px solid var(--hairline)}
.badge.stale,.badge.missing{color:var(--warn);border:1px solid var(--hairline)}
.badge.fresh{color:var(--ink-dim);border:1px solid var(--hairline)}
.row{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--hairline)}
.row:first-of-type{border-top:none}
.row .lbl{min-width:120px;color:var(--ink)}
.row .why{flex:1;color:var(--ink-dim);font-size:12px}
.row a{color:var(--u-col);font-size:12px;text-decoration:none}
.actions{display:flex;gap:10px;margin-top:14px;align-items:center}
#jobbar{display:none;margin-bottom:14px}
#jobbar .track{height:8px;background:var(--panel-2);border:1px solid var(--hairline);
  border-radius:999px;overflow:hidden;margin-top:6px}
#jobbar .fill{height:100%;width:0;background:var(--u-col);transition:width .4s}
.err{color:#ff6b6b;font-size:12px;margin-top:8px;white-space:pre-wrap}
.note{color:var(--ink-dim);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="hub">
  <header class="hubtop">
    <div class="wordmark">py<em>ladcp</em> cruise hub</div>
    <div class="crumbs" id="crumbs">connecting…</div>
    <div style="flex:1"></div>
    <a class="btn" href="./index.html" id="editor-link" style="display:none">station editor →</a>
  </header>
  <div id="jobbar" class="card">
    <div id="jobtext">processing…</div>
    <div class="track"><div class="fill" id="jobfill"></div></div>
  </div>
  <main id="main"><p class="note">loading…</p></main>
</div>
<script src="./hub.js"></script>
</body>
</html>
