[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyladcp"
version = "0.2.0"
description = "Pythonic LADCP processing + acquisition-quality assessment (re-implementation of the LDEO_IX inverse method)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leopoldo D. Pena", email = "lpena@ub.edu" },
]
keywords = ["oceanography", "LADCP", "ADCP", "velocity", "inverse method", "RDI", "LDEO_IX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netcdf4",
    "matplotlib",
    "gsw",
    "ppigrf",
    "tomli >= 1.1.0 ; python_version < '3.11'",   # cruise.toml reading (stdlib tomllib on 3.11+)
    "tomli-w",                                     # cruise.toml writing (stdlib has no emitter)
]

[project.optional-dependencies]
dev = ["ruff==0.15.21", "pytest", "pre-commit", "httpx"]   # ruff pinned: unpinned CI went red on a new release (2026-06); httpx: fastapi TestClient (studio tests)
export = ["openpyxl"]
docs = ["mkdocs-material"]
gui = ["fastapi", "uvicorn"]                       # ladcp-studio local web GUI

[project.urls]
Homepage = "https://github.com/leopenausa/pyladcp"
Repository = "https://github.com/leopenausa/pyladcp"
Issues = "https://github.com/leopenausa/pyladcp/issues"

[project.scripts]
ladcp = "ladcp.hub.cli:main"
ladcp-qa = "ladcp.qa.cli:main"
ladcp-index = "ladcp.archive_cli:main"
ladcp-sadcp-section = "ladcp.plots.sadcp_section:main"
ladcp-section = "ladcp.plots.cruise_section:main"
ladcp-vectormap = "ladcp.plots.cruise_vectormap:main"
ladcp-compare = "ladcp.qa.compare:main"
ladcp-studio = "ladcp.studio.server:main"
ladcp-synth = "ladcp.synth.cli:main"
ladcp-ek80 = "ladcp.ek80_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ladcp.studio" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-solve / golden-fixture tests (quick lane: pytest -m 'not slow')",
]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",   # ambiguous names (l, I) are conventional in the ported numerics
    "E702",   # multiple statements on a line (semicolon) — deliberate compact array setup
]
# NOTE: opinionated auto-formatting (ruff format) is deferred to release hardening (#7);
# for now ruff runs as a lint-only safety net so the ported idiom is preserved.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # path setup before imports in a few tests
