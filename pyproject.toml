[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyladcp"
version = "0.2.0"
description = "Pythonic LADCP processing + acquisition-quality assessment (re-implementation of the LDEO_IX inverse method)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leopoldo D. Pena", email = "lpena@ub.edu" },
]
keywords = ["oceanography", "LADCP", "ADCP", "velocity", "inverse method", "RDI", "LDEO_IX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netcdf4",
    "matplotlib",
    "gsw",
    "ppigrf",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[project.urls]
Homepage = "https://github.com/leopenausa/pyladcp"
Repository = "https://github.com/leopenausa/pyladcp"
Issues = "https://github.com/leopenausa/pyladcp/issues"

[project.scripts]
ladcp-qa = "ladcp.qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",   # ambiguous names (l, I) are conventional in the ported numerics
    "E702",   # multiple statements on a line (semicolon) — deliberate compact array setup
]
# NOTE: opinionated auto-formatting (ruff format) is deferred to release hardening (#7);
# for now ruff runs as a lint-only safety net so the ported idiom is preserved.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # path setup before imports in a few tests
