name: Guide

on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "mkdocs.yml", ".github/workflows/docs.yml", "scripts/build_guide_pdf.sh"]
  pull_request:
    paths: ["docs/guide/**", "mkdocs.yml", ".github/workflows/docs.yml", "scripts/build_guide_pdf.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Flag appendix is current
        env:
          MPLBACKEND: Agg
        run: python docs/guide/gen_flag_reference.py --check
      - name: Build site
        run: mkdocs build --strict
      - name: Build PDF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc texlive-xetex texlive-fonts-recommended fonts-dejavu
          bash scripts/build_guide_pdf.sh site/pyladcp_guide.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyladcp_guide_pdf
          path: site/pyladcp_guide.pdf
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
