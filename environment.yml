name: pyladcp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - xarray
  - netcdf4
  - matplotlib
  - gsw
  - pytest
  - ruff
  - pip
  - pip:
      - ppigrf        # IGRF-13 geomagnetic model (pure python)
      - -e .          # install pyladcp itself (editable)
